
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>24RADAR | PTFS Live Map</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101820;
      color: #e8f0f7;
      font: 14px Arial, sans-serif;
    }
    header {
      padding: 16px 22px;
      background: #182632;
      border-bottom: 1px solid #344653;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 22px; }
    #status { color: #65e6a0; }
    main { padding: 16px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
    }
    .panel {
      background: #182632;
      border: 1px solid #344653;
      border-radius: 8px;
      overflow: hidden;
    }
    .panel h2 {
      font-size: 15px;
      padding: 14px;
      margin: 0;
      border-bottom: 1px solid #344653;
    }
    #map {
      padding: 8px;
      min-height: 300px;
      background: #0b131a;
    }
    #map img {
      display: block;
      width: 100%;
      height: auto;
    }
    #aircraft-list {
      max-height: 70vh;
      overflow-y: auto;
    }
    .aircraft {
      padding: 12px;
      border-bottom: 1px solid #344653;
      cursor: pointer;
    }
    .aircraft:hover, .aircraft.selected {
      background: #263d4d;
    }
    .callsign { color: #75c9ff; font-weight: bold; }
    .details { color: #b3c3cf; margin-top: 5px; line-height: 1.6; }
    #selected {
      padding: 14px;
      line-height: 1.8;
      color: #d6e2eb;
    }
    .note {
      color: #9fb2c0;
      font-size: 12px;
      padding: 12px 14px;
      line-height: 1.5;
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      #aircraft-list { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>✈ 24RADAR</h1>
    <span id="status">Connecting…</span>
  </header>

  <main>
    <div class="layout">
      <section class="panel">
        <h2>PTFS WORLD MAP</h2>
        <div id="map">
          <img src="/enroute-chart.png"
               alt="PTFS en-route chart"
               onerror="this.alt='Map image could not load';">
        </div>
        <div class="note">
          Map loaded as the base chart. Aircraft-to-map coordinate
          calibration is the next step, so aircraft positions are not
          drawn on the chart yet.
        </div>
      </section>

      <section class="panel">
        <h2>LIVE AIRCRAFT · <span id="count">0</span></h2>
        <div id="aircraft-list">Loading aircraft…</div>
        <div id="selected">Select an aircraft to view its details.</div>
      </section>
    </div>
  </main>

  <script>
    const list = document.getElementById('aircraft-list');
    const status = document.getElementById('status');
    const count = document.getElementById('count');
    const selected = document.getElementById('selected');
    let selectedCallsign = null;

    function safe(value) {
      const el = document.createElement('span');
      el.textContent = String(value ?? 'Unknown');
      return el.innerHTML;
    }

    async function refresh() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        const aircraft = data.aircraft || [];

        status.textContent = '● LIVE · Updated ' +
          new Date().toLocaleTimeString();
        count.textContent = aircraft.length;

        list.innerHTML = '';
        for (const a of aircraft) {
          const row = document.createElement('div');
          row.className = 'aircraft' +
            (a.callsign === selectedCallsign ? ' selected' : '');

          row.innerHTML =
            '<div class="callsign">' + safe(a.callsign) + '</div>' +
            '<div class="details">' +
            safe(a.aircraftType) + '<br>' +
            'Altitude: ' + safe(a.altitude) + '<br>' +
            'Speed: ' + safe(a.speed) + '<br>' +
            'Heading: ' + safe(a.heading) +
            '</div>';

          row.addEventListener('click', () => {
            selectedCallsign = a.callsign;
            selected.innerHTML =
              '<strong>' + safe(a.callsign) + '</strong><br>' +
              'Pilot: ' + safe(a.playerName) + '<br>' +
              'Aircraft: ' + safe(a.aircraftType) + '<br>' +
              'Altitude: ' + safe(a.altitude) + '<br>' +
              'Speed: ' + safe(a.speed) + '<br>' +
              'Heading: ' + safe(a.heading) + '°<br>' +
              'Position X: ' + safe(a.x) + '<br>' +
              'Position Y: ' + safe(a.y);
            refresh();
          });
          list.appendChild(row);
        }

        if (!aircraft.length) list.textContent = 'No aircraft reported.';
      } catch (error) {
        status.textContent = 'Connection error';
        list.textContent = 'Could not load live aircraft. Retrying…';
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
